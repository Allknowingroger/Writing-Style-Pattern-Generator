<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writing Style Pattern Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #f4f7f9;
        --text-color: #333;
        --primary-color: #007bff;
        --primary-hover-color: #0056b3;
        --container-bg: #ffffff;
        --border-color: #dee2e6;
        --error-color: #dc3545;
        --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 2rem;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }

      #root {
        width: 100%;
        max-width: 800px;
      }

      .app-container {
        background-color: var(--container-bg);
        border-radius: 12px;
        box-shadow: var(--card-shadow);
        padding: 2.5rem;
      }

      h1 {
        text-align: center;
        margin-bottom: 2rem;
        color: var(--text-color);
        font-weight: 600;
      }

      .input-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        font-size: 0.9rem;
      }

      textarea, select {
        width: 100%;
        padding: 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        background-color: white;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }
      
      select {
          appearance: none;
          background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
          background-repeat: no-repeat;
          background-position: right 0.75rem center;
          background-size: 16px 12px;
          cursor: pointer;
      }

      textarea:focus, select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
      }
      
      .button-group {
        display: flex;
        gap: 0.75rem;
      }

      .generate-button, .secondary-button {
        flex: 1;
        padding: 0.85rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s, border-color 0.2s, color 0.2s;
        border: 1px solid transparent;
      }

      .generate-button {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
        color: white;
      }
      
      .generate-button:hover:not(:disabled) {
        background-color: var(--primary-hover-color);
        border-color: var(--primary-hover-color);
        transform: translateY(-2px);
      }
      
      .generate-button:disabled {
        background-color: #a0c3e6;
        border-color: #a0c3e6;
        cursor: not-allowed;
      }
      
      .secondary-button {
        background-color: transparent;
        color: var(--primary-color);
        border-color: var(--primary-color);
      }

      .secondary-button:hover:not(:disabled) {
        background-color: var(--primary-color);
        color: white;
        transform: translateY(-2px);
      }

      .secondary-button:disabled {
        border-color: #a0c3e6;
        color: #a0c3e6;
        cursor: not-allowed;
      }

      .result-container {
        position: relative;
        margin-top: 2rem;
        padding: 1.5rem;
        border-radius: 8px;
        background-color: #f8f9fa;
        border: 1px solid var(--border-color);
        white-space: pre-wrap;
        font-family: 'Roboto Mono', monospace;
        line-height: 1.6;
        overflow-x: auto;
      }
      
      .result-container.placeholder {
        color: #6c757d;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 150px;
        font-family: 'Inter', sans-serif;
      }

      .copy-button {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        background-color: #e9ecef;
        color: #495057;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        padding: 0.25rem 0.6rem;
        font-size: 0.8rem;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        transition: background-color 0.2s, color 0.2s;
        z-index: 10;
      }

      .copy-button:hover {
        background-color: #ced4da;
      }

      .error-message {
        text-align: center;
        margin-top: 2rem;
        padding: 1rem;
        border-radius: 8px;
        background-color: #f8d7da;
        color: var(--error-color);
        border: 1px solid #f5c6cb;
      }

      @media (max-width: 600px) {
        body {
          padding: 1rem;
        }
        .app-container {
          padding: 1.5rem;
        }
        .button-group {
          flex-direction: column;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.17.0",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
